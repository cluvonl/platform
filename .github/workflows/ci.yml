name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluvo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The fixed 31→32 proof loads and hashes the actual prior renderer.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:wp0

  database:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Preserve availability of the explicitly approved predecessor.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prove the closed additive writer and native PWA contracts in an owned PostgreSQL17 database
        env:
          CLUVO_PWA_UPGRADE_NATIVE_TESTS: owned-pg17
          CLUVO_PWA_UPGRADE_DOCKER_SCOPE: hosted
        run: |
          set -euo pipefail
          docker --host unix:///var/run/docker.sock pull public.ecr.aws/supabase/postgres@sha256:0450166354dc9c1d25f0322ac8b580774d4fb0184d2b087f6e4fe9499c66cf53
          node --test tests/staging-pwa-upgrade-native.test.mjs

      - name: Migrations, pgTAP and database lint
        run: |
          set -euo pipefail

          node scripts/start-local-database.mjs

          trap 'npx supabase stop --no-backup' EXIT

          npx supabase test db --local

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:race

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:locks

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:intake-lock

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:invitations
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:reconfirmation
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:assistance

          npm run db:test:staging-data

          npx supabase db lint --local --schema app,api,internal \
            --level warning \
            --fail-on warning
