name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluvo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:wp0

  database:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Migrations, pgTAP and database lint
        run: |
          set -euo pipefail

          node scripts/start-local-database.mjs

          trap 'npx supabase stop --no-backup' EXIT

          npx supabase test db --local

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:race

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:locks

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres \
            npm run db:test:intake-lock

          npx supabase db lint --local --schema app,api,internal \
            --level warning \
            --fail-on warning
