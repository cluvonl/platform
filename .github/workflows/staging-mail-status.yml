name: Staging email status check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluvo-staging-mail-status
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'cluvonl/platform' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Read only the agreed test email delivery status
        env:
          APP_ENV: staging
          RELEASE_SHA: ${{ github.sha }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          STAGING_TEST_RECIPIENT: ${{ secrets.STAGING_TEST_RECIPIENT }}
          MAIL_ALLOWLIST: ${{ secrets.MAIL_ALLOWLIST }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
        run: node scripts/staging-mail-status.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cluvo-staging-mail-status-${{ github.sha }}-${{ github.run_id }}
          path: staging-mail-status.json
          if-no-files-found: error
          retention-days: 30
