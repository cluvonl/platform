name: Staging native authorization and booking QA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cluvo-staging
  cancel-in-progress: false

jobs:
  qa:
    if: github.repository == 'cluvonl/platform' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the current tested staging promotion before provider access
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const release=process.env.RELEASE_SHA;
          const request=async path=>{
            const response=await fetch('https://api.github.com/repos/cluvonl/platform/'+path,{
              headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN},
              redirect:'error',signal:AbortSignal.timeout(15000)});
            if(response.status!==200)throw Error('STAGING_RELEASE_CHECK_FAILED');
            return await response.json();
          };
          const [main,runs]=await Promise.all([
            request('git/ref/heads/main'),
            request('actions/workflows/ci.yml/runs?branch=main&head_sha='+release+'&per_page=10')
          ]);
          if(main.object?.sha!==release||!runs.workflow_runs?.some(run=>run.head_sha===release&&run.head_branch==='main'
            &&run.status==='completed'&&run.conclusion==='success'))throw Error('STAGING_TESTED_RELEASE_REQUIRED');
          console.log('STAGING_TESTED_RELEASE_PASS');
          JS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove native tenant privacy, actual last-place overlap, retries and logout
        env:
          APP_ENV: staging
          RELEASE_SHA: ${{ github.sha }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_SSL_ROOT_CERT_PATH: ${{ github.workspace }}/ops/tls/supabase-platform-root-ca.pem
        run: node scripts/staging-native-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cluvo-staging-native-qa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-native-qa.json
          if-no-files-found: error
          retention-days: 30
