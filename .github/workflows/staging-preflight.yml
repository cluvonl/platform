name: Staging credentials check

on:
  workflow_dispatch:
    inputs:
      verify_system_ca:
        description: Verify the database certificate and hostname using the runner CA bundle
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cluvo-staging-preflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'cluvonl/platform' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify credentials and database metadata without deployment
        env:
          APP_ENV: staging
          RELEASE_SHA: ${{ github.sha }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INVITATION_TOKEN_SECRET: ${{ secrets.INVITATION_TOKEN_SECRET }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_SSL_ROOT_CERT_PATH: ${{ inputs.verify_system_ca && '/etc/ssl/certs/ca-certificates.crt' || '' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
        run: node scripts/staging-preflight.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cluvo-staging-preflight-${{ github.sha }}-${{ github.run_id }}
          path: staging-preflight.json
          if-no-files-found: error
          retention-days: 30
