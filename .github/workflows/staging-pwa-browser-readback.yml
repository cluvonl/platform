name: Staging PWA active image browser readback

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cluvo-staging
  cancel-in-progress: false

jobs:
  browser_readback:
    if: github.repository == 'cluvonl/platform' && github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact tested and active staging image before private credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {activeStagingRelease} from './scripts/staging-pwa-release-health.mjs';
          const request=async path=>{
            const response=await fetch('https://api.github.com/repos/cluvonl/platform/'+path,{
              headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN},
              redirect:'error',signal:AbortSignal.timeout(15000)});
            if(response.status!==200)throw Error('STAGING_BROWSER_RELEASE_REQUIRED');
            return response.json();
          };
          const sha=process.env.RELEASE_SHA;
          const [main,staging,runs]=await Promise.all([request('git/ref/heads/main'),request('git/ref/heads/staging'),request('actions/workflows/ci.yml/runs?branch=main&head_sha='+sha+'&per_page=10')]);
          if(main.object?.sha!==sha||staging.object?.sha!==sha||!runs.workflow_runs?.some(run=>run.head_sha===sha&&run.head_branch==='main'&&run.status==='completed'&&run.conclusion==='success')||!await activeStagingRelease(sha))throw Error('STAGING_BROWSER_RELEASE_REQUIRED');
          console.log('STAGING_BROWSER_TESTED_ACTIVE_RELEASE_PASS');
          JS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the fixed separate browser test toolchain
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cluvo-pwa-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0
          "$RUNNER_TEMP/cluvo-pwa-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify twenty native SSR routes and privacy on the active image
        env:
          APP_ENV: staging
          RELEASE_SHA: ${{ github.sha }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_SSL_ROOT_CERT_PATH: ${{ github.workspace }}/ops/tls/supabase-platform-root-ca.pem
        run: |
          export PWA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/cluvo-pwa-browser/node_modules/playwright/index.mjs"
          node scripts/staging-pwa-browser-readback.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cluvo-staging-pwa-browser-readback-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-pwa-browser-readback.json
          if-no-files-found: error
          retention-days: 30
