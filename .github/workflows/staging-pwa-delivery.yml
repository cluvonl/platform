name: Staging PWA notification delivery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: cluvo-staging
  cancel-in-progress: false

jobs:
  delivery:
    if: github.repository == 'cluvonl/platform' && vars.STAGING_PWA_DELIVERY_ENABLED == 'true' && (github.event_name == 'schedule' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: staging
          persist-credentials: false
      - name: Verify the exact tested promotion before delivery credentials
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_SHA="$(git rev-parse HEAD)"
          node --input-type=module <<'JS'
          import {appendFile} from 'node:fs/promises';
          import {activeStagingRelease} from './scripts/staging-pwa-release-health.mjs';
          const request=async path=>{
            const response=await fetch('https://api.github.com/repos/cluvonl/platform/'+path,{
              headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN},
              redirect:'error',signal:AbortSignal.timeout(15000)});
            if(response.status!==200)throw Error('STAGING_RELEASE_CHECK_FAILED');
            return response.json();
          };
          const sha=process.env.RELEASE_SHA;
          const [main,staging,runs]=await Promise.all([request('git/ref/heads/main'),request('git/ref/heads/staging'),request('actions/workflows/ci.yml/runs?branch=main&head_sha='+sha+'&per_page=10')]);
          const tested=main.object?.sha===sha&&staging.object?.sha===sha&&runs.workflow_runs?.some(run=>run.head_sha===sha&&run.head_branch==='main'&&run.status==='completed'&&run.conclusion==='success');
          const ready=tested&&await activeStagingRelease(sha);
          if(!ready&&process.env.GITHUB_EVENT_NAME!=='schedule')throw Error('STAGING_TESTED_RELEASE_REQUIRED');
          await appendFile(process.env.GITHUB_OUTPUT,'ready='+Boolean(ready)+'\n');
          console.log(ready?'STAGING_TESTED_RELEASE_PASS':'STAGING_PROMOTION_PENDING');
          JS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.promotion.outputs.ready == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.promotion.outputs.ready == 'true'
      - name: Deliver only approved staging recipients and save per-device receipts
        if: steps.promotion.outputs.ready == 'true'
        env:
          APP_ENV: staging
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
          MAIL_ALLOWLIST: ${{ secrets.MAIL_ALLOWLIST }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          export RELEASE_SHA="$(git rev-parse HEAD)"
          node scripts/staging-pwa-delivery.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.promotion.outputs.ready == 'true'
        with:
          name: cluvo-staging-pwa-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-pwa-delivery.json
          if-no-files-found: error
          retention-days: 30
