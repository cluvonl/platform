services:
  web:
    image: ${CLUVO_IMAGE:?immutable image reference required}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - /etc/cluvo/staging.env
    environment:
      APP_ENV: staging
      APP_MODE: ${CLUVO_APP_MODE:?validated staging mode required}
      RELEASE_SHA: ${CLUVO_RELEASE_SHA:?exact commit required}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
